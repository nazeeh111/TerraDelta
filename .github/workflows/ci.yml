name: correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.20
      - run: uv sync --frozen --extra ml --extra dev
      - run: uv run ruff check src scripts tests
      - run: uv run pytest -q
      - run: node tests/ui_query_regression.cjs
      - run: uv run terradelta --help
      - run: uv run python -m build
