[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terradelta-history"
version = "0.1.0"
description = "Observation-aware, revisable building-change histories from permitted satellite imagery"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy==2.2.6", "scipy==1.16.3", "rasterio==1.4.3",
  "geopandas==1.1.1", "duckdb==1.4.3", "pyarrow==22.0.0",
  "scikit-image==0.25.2", "fastapi==0.121.3", "uvicorn==0.38.0",
  "typer==0.20.0", "pillow==12.0.0"
]

[project.optional-dependencies]
ml = ["torch==2.9.1", "torchvision==0.24.1"]
dev = ["pytest==9.0.1", "httpx==0.28.1", "ruff==0.14.6", "build==1.3.0", "matplotlib==3.10.7"]

[project.scripts]
terradelta = "terradelta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terradelta = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

